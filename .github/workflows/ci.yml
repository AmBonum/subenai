name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Cancel in-progress runs for the same ref when a new push lands.
# Free-tier minutes saver: a PR with 5 quick pushes consumes 1x, not 5x.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-lint-build:
    name: Lint + Vitest + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vitest (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Upload coverage only on main pushes — PRs don't need stored artifacts
      # (the coverage thresholds in vitest already gate the job).
      - name: Upload coverage artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14
