name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Cancel in-progress runs for the same ref when a new push lands.
# Free-tier minutes saver: a PR with 5 quick pushes consumes 1x, not 5x.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-lint-build:
    name: Lint + Vitest + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Covers both projects: app/tests (tsconfig.json) + e2e/playwright/scripts
      # (tsconfig.e2e.json).
      - name: Typecheck
        run: npm run typecheck:all

      - name: Vitest (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Bundle guards — scan the built client bundle for leaked secrets,
      # mock-module identifiers, and tracker SDK domains.
      - name: Bundle guard — no secrets
        run: npm run check:bundle-no-secrets

      - name: Bundle guard — no mocks
        run: npm run check:bundle-no-mocks

      - name: Bundle guard — no trackers
        run: npm run audit:bundle

      # Perf budget — fail if a gzipped JS chunk (or the total) grows past
      # its budget in perf-budget.json. Catches accidental bloat that the
      # >500 kB Rollup warning only whispers about.
      - name: Bundle guard — size budget
        run: npm run check:bundle-budget

      # E48 incident response — verify RPCs + tables exist in production.
      # Skipped when secrets are absent (fork PRs, local runs without prod creds).
      # To activate: add VITE_SUPABASE_URL + PROD_INVARIANT_CHECK_KEY secrets
      # in repo Settings → Secrets → Actions.  See tasks/POST-MIGRATION-CHECKLIST.md §6.
      - name: Schema invariants (prod)
        if: env.VITE_SUPABASE_URL != ''
        run: npx vitest run tests/db/prod-schema-invariants.test.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PROD_INVARIANT_CHECK_KEY: ${{ secrets.PROD_INVARIANT_CHECK_KEY }}

      # Upload coverage only on main pushes — PRs don't need stored artifacts
      # (the coverage thresholds in vitest already gate the job).
      - name: Upload coverage artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14
