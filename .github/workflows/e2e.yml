name: E2E

# E20 — opt-in browser e2e + always-on integration tests on PR.
#
# Default policy (revised 2026-05-20 — owner decision dropped the
# auto full-sweep on main push):
#   - PR targeting main:    integration tests run by default (~1 min).
#                           Browser tests are OPT-IN via a label.
#   - push to main:         integration tests only — NO automatic browser
#                           sweep. (Previous policy ran ~8 min on every
#                           merge; owner pushed back that the relevant
#                           coverage is already ensured by the PR-side
#                           label workflow + ci.yml vitest on every push.)
#                           If a risky merge needs full browser e2e,
#                           trigger via workflow_dispatch.
#   - workflow_dispatch:    FULL browser suite, manual trigger.
#
# PR labels:
#   - e2e:browser  → run browser tests with selective filtering by changed
#                    source paths (only the relevant domain specs + cross-cutting).
#                    Use this when reviewing UI-critical changes.
#   - e2e:full     → run the FULL browser suite, no path filtering.
#                    Use this when changing shared infra (design tokens,
#                    auth flow, supabase schema).
#   - e2e:skip     → skip integration tests too. Use for docs-only PRs
#                    where even the API smoke is noise.
#
# Path → domain mapping is documented in
# tasks/PLAN-2026-05-19-E20-selective-e2e-ci.md and reproduced in the
# `filter` step below. Keep the two in sync when adjusting.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Step 1: detect which file domains changed ─────────────────────────────
  # Cheap (~15 s) — does a git diff via paths-filter and emits per-domain
  # boolean outputs that the playwright job consumes in its `if:` and
  # spec-path-derivation steps.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # Always run; pre-merge skip logic is in the playwright job's `if`.
    outputs:
      full: ${{ steps.filter.outputs.full }}
      marketing: ${{ steps.filter.outputs.marketing }}
      admin: ${{ steps.filter.outputs.admin }}
      app: ${{ steps.filter.outputs.app }}
      auth: ${{ steps.filter.outputs.auth }}
      consent: ${{ steps.filter.outputs.consent }}
      sponsorship: ${{ steps.filter.outputs.sponsorship }}
      composer: ${{ steps.filter.outputs.composer }}
      quiz: ${{ steps.filter.outputs.quiz }}
      courses: ${{ steps.filter.outputs.courses }}
      blog: ${{ steps.filter.outputs.blog }}
      test-packs: ${{ steps.filter.outputs.test-packs }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        # Pinned to a specific commit SHA for supply-chain safety. Bump via
        # Dependabot or monthly manual review.
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            full:
              # Any change here forces the full browser suite. These files
              # cascade into every domain (design tokens, build config,
              # the e2e layer itself, the supabase singleton).
              - 'src/components/ui/**'
              - 'src/styles.css'
              - 'tailwind.config*'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - 'e2e/**'
              - '.github/workflows/**'
              - 'src/integrations/supabase/client.ts'
              - 'src/integrations/supabase/types.ts'
            marketing:
              - 'src/routes/about.tsx'
              - 'src/routes/contact.tsx'
              - 'src/routes/index.tsx'
              - 'src/routes/changelog.tsx'
              - 'src/routes/cookies.tsx'
              - 'src/routes/privacy.tsx'
              - 'src/routes/schools.tsx'
              - 'src/routes/support.tsx'
              - 'src/routes/sponsors*.tsx'
              - 'src/routes/manage-support.tsx'
              - 'src/components/home/**'
              - 'src/components/layout/**'
              - 'src/components/schools/**'
              - 'src/i18n/locales/sk/marketing.json'
              - 'src/i18n/marketing*'
              - 'src/lib/seo/faq-jsonld*'
              - 'src/lib/seo/schools-jsonld*'
            admin:
              - 'src/routes/admin/**'
              - 'src/components/admin/**'
              - 'src/lib/admin/**'
              - 'src/lib/blog/admin-queries*'
              - 'e2e/specs/admin/detail-*.spec.ts'
              - 'e2e/specs/admin/queue-*.spec.ts'
              - 'e2e/integration/admin/**'
            app:
              - 'src/routes/app*'
              - 'src/lib/platform/**'
              - 'src/lib/edu/**'
              - 'src/components/app/**'
              - 'src/components/composer/edu/**'
            auth:
              - 'src/routes/auth*'
              - 'src/routes/forgot-password*'
              - 'src/integrations/supabase/auth*'
              - 'src/components/auth/**'
            consent:
              - 'src/hooks/useConsent*'
              - 'src/lib/consent*'
              - 'src/components/layout/Consent*'
              - 'src/routes/cookies*'
            sponsorship:
              - 'src/routes/support.tsx'
              - 'src/routes/sponsors*.tsx'
              - 'src/routes/manage-support.tsx'
              - 'src/routes/r.$shareId.tsx'
              - 'src/components/sponsorship/**'
              - 'src/lib/sponsors/**'
            composer:
              - 'src/routes/test.zostav*'
              - 'src/components/composer/**'
              - 'src/lib/quiz/composer*'
            quiz:
              - 'src/routes/test.*'
              - 'src/components/quiz/**'
              - 'src/lib/quiz/**'
              - 'src/lib/share/**'
              - 'src/lib/data-trap/**'
              - 'src/i18n/quiz*'
              - 'src/i18n/locales/sk/quiz.json'
            courses:
              - 'src/routes/courses*'
              - 'src/components/courses/**'
              - 'src/content/courses/**'
            blog:
              - 'src/routes/blog/**'
              - 'src/components/blog/**'
              - 'src/lib/blog/**'
              - 'src/content/blog/**'
              - 'src/i18n/locales/sk/blog.json'
            test-packs:
              - 'src/routes/tests*'

  # ── Step 2: build once + run filtered specs ──────────────────────────────
  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Browser tests are OPT-IN. The chromium suite is expensive (~3-8
    # min); the typical PR doesn't need it — the reviewer or author
    # applies `e2e:browser` (selective) or `e2e:full` (no filter) when
    # the change is UI-critical. Push to main NO LONGER triggers this
    # job (owner policy revision 2026-05-20 — see file-level comment).
    # For risky merges, use `workflow_dispatch` to run the full sweep
    # manually after merge.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        (
          contains(github.event.pull_request.labels.*.name, 'e2e:browser') ||
          contains(github.event.pull_request.labels.*.name, 'e2e:full')
        )
      )
    env:
      # Derived once, consumed by the spec-paths + run steps below.
      # `push` was removed from the OR chain on 2026-05-20 (owner
      # policy) — main-push no longer reaches this job at all, so the
      # `push`-checks above can't fire. workflow_dispatch keeps the
      # manual nuclear option open.
      IS_FULL: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.full == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'e2e:full')
        }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Chromium alone is 100MB+ download; cache keyed on the lockfile so a
      # Playwright version bump invalidates automatically.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # ── Selective: derive the positional spec-path list for `playwright test` ─
      # Cross-cutting is hardcoded first and unconditional. Domain dirs are
      # appended based on the paths-filter flags. Playwright accepts
      # positional path prefixes as test-file filters.
      - name: Compute spec paths to run
        id: spec-paths
        if: env.IS_FULL != 'true'
        shell: bash
        run: |
          paths="e2e/specs/cross-cutting"

          add() { paths="$paths $1"; }

          [[ "${{ needs.changes.outputs.marketing }}" == "true" ]] && add "e2e/specs/marketing"
          [[ "${{ needs.changes.outputs.admin }}" == "true" ]] && add "e2e/specs/admin"
          [[ "${{ needs.changes.outputs.app }}" == "true" ]] && add "e2e/specs/app"
          [[ "${{ needs.changes.outputs.auth }}" == "true" ]] && add "e2e/specs/auth"
          [[ "${{ needs.changes.outputs.consent }}" == "true" ]] && add "e2e/specs/consent"
          [[ "${{ needs.changes.outputs.sponsorship }}" == "true" ]] && add "e2e/specs/sponsorship"
          [[ "${{ needs.changes.outputs.composer }}" == "true" ]] && add "e2e/specs/composer"
          [[ "${{ needs.changes.outputs.quiz }}" == "true" ]] && add "e2e/specs/quiz"
          [[ "${{ needs.changes.outputs.courses }}" == "true" ]] && add "e2e/specs/courses"
          [[ "${{ needs.changes.outputs.blog }}" == "true" ]] && add "e2e/specs/blog"
          [[ "${{ needs.changes.outputs.test-packs }}" == "true" ]] && add "e2e/specs/test-packs"

          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Selective spec paths: $paths"

      - name: Run Playwright (full suite)
        if: env.IS_FULL == 'true'
        run: npx playwright test --project=e2e-chromium

      - name: Run Playwright (selective)
        if: env.IS_FULL != 'true'
        run: npx playwright test --project=e2e-chromium ${{ steps.spec-paths.outputs.paths }}

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces / screenshots / videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 14

  # ── Integration tests: API-only, runs unconditionally ────────────────────
  # No browser, no build. Cost is ~30 s total. Skipped only when the PR
  # explicitly labels e2e:skip (and even then runs on push/dispatch).
  integration:
    name: Playwright (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.pull_request.labels.*.name, 'e2e:skip')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Integration specs hit BASE_URL via Playwright's `request` fixture.
      # Set vars.E2E_BASE_URL in repo Settings → Secrets and variables →
      # Actions → Variables. Falls back to subenai.sk (production) so the
      # suite has a live target even when the variable is unset — safer
      # than localhost which surely refuses connections in a CI runner.
      #
      # SKIP_WEBSERVER=1 prevents Playwright from trying to boot
      # `npm run preview` (no `dist/` exists in this job — we skip
      # `npm run build` deliberately to keep the integration job fast).
      - name: Run integration tests
        run: npx playwright test --project=integration
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL || 'https://subenai.sk' }}
          SKIP_WEBSERVER: "1"

      - name: Upload integration report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
