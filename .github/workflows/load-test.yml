name: Load test

# Wires the EXISTING local load suite (scripts/load-test.mjs, `npm run load`)
# into CI. The script is loopback-only by design (it refuses any non-local
# host), so it boots a vite-preview of the production build on :8080 inside
# the runner and hammers the public serving routes — p99 / RPS / error
# budgets are enforced by the script itself.
#
# Not a PR gate: a loaded shared runner can blow the p99 budget for reasons
# unrelated to the change. Run on demand and weekly to track the trend; the
# Vitest API rate-limit + payload-stress suites in `npm run perf` already
# gate that layer on every PR via the main CI job.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    name: Serving-layer load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Load test (npm run load)
        run: npm run load
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
