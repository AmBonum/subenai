name: E49 prod-smoke

# E49 Phase 1c-4 — post-merge canary against https://subenai.sk + production
# Supabase. Drives 8 user-visible contracts on the `/app/tests` respondent
# drill-down feature (PS-01..PS-08 in `tasks/PLAN-2026-05-22-E49-test-scenarios.md`).
#
# REQUIRED GITHUB SECRETS (Settings → Secrets → Actions):
#   SUPABASE_PROD_URL          — e.g. https://<ref>.supabase.co (used to
#                                derive the pooler project_ref)
#   SUPABASE_DB_PASSWORD_PROD  — the **Postgres database password**
#                                (Supabase dashboard → Project Settings →
#                                Database → Database Password). Not the
#                                service-role JWT — pooler auth rejects it.
#                                Used ONLY by the teardown psql step; never
#                                passed to the playwright runner.
#
# DATA SHAPE:
#   The canary test + 3 sessions + 6 answers must already exist on prod
#   (seed via `supabase/scripts/seed-e49-prodsmoke-data.sql`, pasted into
#   the Supabase dashboard SQL editor — idempotent). The teardown step
#   below runs ALWAYS — even on failure — so a flaky run does not leak
#   `e2e-e49-prodsmoke-%` rows.
#
# CLEANUP CONTRACT:
#   Only rows where `tests.slug LIKE 'e2e-e49-prodsmoke-%'` are deleted.
#   Auth users (`e2e-e49-educator-a@subenai.test`) persist across runs.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/routes/app.tests.**"
      - "src/components/app/tests/**"
      - "functions/api/tests/**"
      - "e2e/specs/prod-smoke/**"
      - "e2e/poms/prod-smoke/**"
      - ".github/workflows/e49-prod-smoke.yml"

jobs:
  e49-prod-smoke:
    name: E49 prod-smoke — /app/tests respondent drill-down
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E49 prod-smoke
        run: npx playwright test --project=prod-smoke --grep "E49"
        env:
          CI_PROD_SMOKE: "1"
          # prod-smoke project hits https://subenai.sk directly — no local
          # `vite preview` needed. Without this, the default CI `webServer`
          # block in `playwright.config.ts` boots `npm run preview` and waits
          # 120s for it, which never serves anything useful here and the run
          # times out before the first spec.
          SKIP_WEBSERVER: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e49-prod-smoke-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      # Always-run teardown. Body mirrors the comment block in
      # `supabase/scripts/seed-e49-prodsmoke-data.sql`. The seed is
      # idempotent, so a subsequent re-seed brings the canary back —
      # but in the steady state we leave the rows deleted and re-seed
      # only on demand (next manual seed run or when the workflow file
      # is re-run with the seed step locally).
      - name: Teardown — purge prod-smoke rows
        if: always()
        env:
          PGCONN: ${{ secrets.SUPABASE_PROD_URL }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_PASSWORD:-}" ] || [ -z "${PGCONN:-}" ]; then
            echo "Missing SUPABASE_PROD_URL or SUPABASE_DB_PASSWORD_PROD — skipping teardown."
            exit 0
          fi
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          # Pooler auth: username is `postgres.<project_ref>`, password is
          # the actual Postgres DB password (NOT the service-role JWT —
          # that's an API key, not a DB credential). Pass via PGPASSWORD
          # env var rather than the connection URI — psql then handles
          # the password verbatim, side-stepping URL-encoding for chars
          # like `=`, `+`, `&` that resets routinely emit.
          PROJECT_HOST="$(echo "${PGCONN}" | sed -E 's#https?://([^./]+)\.supabase\.co.*#\1#')"
          export PGPASSWORD="${DB_PASSWORD}"
          psql \
            -h aws-0-eu-west-1.pooler.supabase.com \
            -p 6543 \
            -U "postgres.${PROJECT_HOST}" \
            -d postgres \
            -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DELETE FROM public.session_answers
           WHERE session_id IN (
             SELECT s.id FROM public.sessions s
             JOIN public.tests t ON t.id = s.test_id
             WHERE t.slug LIKE 'e2e-e49-prodsmoke-%'
           );
          DELETE FROM public.sessions
           WHERE test_id IN (
             SELECT id FROM public.tests WHERE slug LIKE 'e2e-e49-prodsmoke-%'
           );
          DELETE FROM public.test_questions
           WHERE test_id IN (
             SELECT id FROM public.tests WHERE slug LIKE 'e2e-e49-prodsmoke-%'
           );
          DELETE FROM public.tests   WHERE slug LIKE 'e2e-e49-prodsmoke-%';
          DELETE FROM public.questions
           WHERE id IN (
             'e2e00001-e49a-4001-8001-7e57cab00501'::uuid,
             'e2e00001-e49a-4001-8001-7e57cab00502'::uuid,
             'e2e00001-e49a-4001-8001-7e57cab00503'::uuid
           );
          COMMIT;
          SQL
