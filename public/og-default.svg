<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="subenai — Otestuj sa za 5 minút">
  <!--
    E31 — default social-card OG image for routes that don't have a
    bespoke image. Referenced from:
      - /r/$shareId  (share-page social preview)
      - /s/$slug     (admin-authored CMS pages)
      - /schools     (B2B landing)
    Rasterized to public/og-default.png at build time via
    scripts/generate-og-default.mjs (sharp). Facebook + LinkedIn + X
    rasterize PNG only — SVG fallback works on Slack / Discord /
    Telegram. Ship both; reference PNG from head().

    Brand colors are flat hex (no oklch) so social platforms render
    consistently. Hex values are close approximations of the runtime
    oklch palette in src/styles.css.
  -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14182a"/>
      <stop offset="100%" stop-color="#0a0d18"/>
    </linearGradient>
    <radialGradient id="accent-glow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#c4ec3a" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#ee6c3d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ee6c3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4ec3a"/>
      <stop offset="100%" stop-color="#ee6c3d"/>
    </linearGradient>
    <pattern id="dot-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background stack: dark gradient → dot texture → accent corner glow -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>
  <rect width="1200" height="630" fill="url(#accent-glow)"/>

  <!-- Top accent strip — a thin brand-gradient line anchors the card -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#wordmark-grad)"/>

  <!-- Brand wordmark — large, centered, gradient-filled. SVG <text>
       uses a generic system font so platforms without our brand font
       still render readable text. -->
  <text
    x="600"
    y="295"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="160"
    font-weight="900"
    letter-spacing="-6"
    fill="url(#wordmark-grad)"
  >subenai</text>

  <!-- Tagline — Slovak, value-led, sized for legibility in social
       preview thumbnails at ~600px wide. -->
  <text
    x="600"
    y="385"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="44"
    font-weight="600"
    fill="#f9fafb"
    fill-opacity="0.92"
  >Otestuj sa za 5 minút. Anonymne. Zadarmo.</text>

  <!-- Secondary tagline / value chip strip -->
  <g transform="translate(600, 460)" text-anchor="middle">
    <text
      font-family="ui-sans-serif, system-ui, sans-serif"
      font-size="26"
      font-weight="500"
      fill="#9aa3b8"
      letter-spacing="2"
    >ROZPOZNAJ PHISHING · FAKE E-SHOPY · VISHING · DEEPFAKY</text>
  </g>

  <!-- Domain badge bottom-right -->
  <g transform="translate(1130, 580)" text-anchor="end">
    <text
      font-family="ui-sans-serif, system-ui, sans-serif"
      font-size="28"
      font-weight="700"
      fill="#c4ec3a"
    >subenai.sk</text>
  </g>
</svg>
